<!doctype html>
<html lang="pt">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#070b14" />
    <title>Vitrine360 Player (Offline)</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #070b14;
        color: #fff;
        font-family: system-ui, sans-serif;
        cursor: none;
        user-select: none;
      }
      #root {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 0;
        box-sizing: border-box;
      }
      .brand {
        letter-spacing: 0.35em;
        opacity: 0.45;
        font-size: 0.85rem;
      }
      h1 {
        font-size: clamp(2rem, 6vw, 3.5rem);
        margin: 1.5rem 0 1rem;
        font-weight: 600;
      }
      p {
        font-size: clamp(1.1rem, 3vw, 1.6rem);
        opacity: 0.85;
        max-width: 40rem;
        margin: 0 auto;
        line-height: 1.4;
      }
      img,
      video {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: #000;
      }
      .meta {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="root">A recuperar conteúdo local…</div>
    <div class="meta" id="meta"></div>
    <script src="/v360-offline-boot.js"></script>
  </body>
</html>
