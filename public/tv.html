<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <title>Vitrine360 Player (Smart TV)</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #070b14;
        color: #fff;
        font-family: system-ui, sans-serif;
      }
      #root {
        min-height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
        box-sizing: border-box;
      }
      .muted {
        color: rgba(255, 255, 255, 0.55);
      }
      .code {
        font-family: ui-monospace, monospace;
        font-size: 64px;
        letter-spacing: 0.35em;
        margin: 24px 0 0;
      }
      .brand {
        font-size: 40px;
        font-weight: 600;
        margin: 0;
      }
      button {
        margin-top: 28px;
        padding: 12px 24px;
        font-size: 18px;
        background: #1e3a5f;
        color: #fff;
        border: 1px solid #3b82f6;
        border-radius: 6px;
      }
      .slide {
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        width: 100%; height: 100%;
        overflow: hidden;
      }
      .fade-in {
        animation: fadeIn 0.8s ease-in-out;
      }
      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      .slide-left { animation: slideLeft 0.42s ease both; }
      .zoom { animation: zoomIn 0.42s ease both; }
      .cut { animation: none; }
      @keyframes slideLeft {
        from { opacity: 0; transform: translateX(4%); }
        to { opacity: 1; transform: translateX(0); }
      }
      @keyframes zoomIn {
        from { opacity: 0; transform: scale(1.04); }
        to { opacity: 1; transform: scale(1); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <p class="muted" style="font-size: 28px; margin: 0">A iniciar…</p>
      <p class="muted" style="font-size: 14px; margin-top: 16px" id="ver">v0.1.22-smarttv-static</p>
    </div>
    <script>
      window.onerror = function (msg, src, line, col) {
        var r = document.getElementById("root");
        if (r) {
          r.innerHTML =
            '<p style="font-size:22px;margin:0;color:#ff6b6b">Erro no arranque</p>' +
            '<p class="muted" style="font-size:14px;margin-top:12px;max-width:520px;word-break:break-all">' +
            String(msg) + ' (L' + line + ')' +
            '</p>' +
            '<p class="muted" style="font-size:13px;margin-top:16px">Limpe a cache do browser e recarregue.</p>';
        }
      };
    </script>
    <script>
      if (navigator.serviceWorker) {
        navigator.serviceWorker
          .register("/tv-sw.js?v=055")
          .then(function (registration) {
            if (navigator.onLine && registration.update) {
              registration.update();
            }
          })
          .catch(function () {
            /* Legacy Smart TV browsers may not support service workers. */
          });
      }
    </script>
    <script src="/tv.js?v=055"></script>
  </body>
</html>
